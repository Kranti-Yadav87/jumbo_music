name: Build & Publish Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_apk:
    name: Build release APK and publish to GitHub Releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # Optional release signing: add these repository secrets to sign the APK
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Prepare signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          K_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/upload-keystore.jks
            echo "$KS" | base64 -d > android/upload-keystore.jks
            cat > android/key.properties <<EOF
storePassword=${K_PASS}
keyPassword=${KEY_PASS}
keyAlias=${K_ALIAS}
storeFile=upload-keystore.jks
EOF
          elif [ -f "android/app/debug.keystore" ]; then
            cat > android/key.properties <<EOF
storePassword=android
keyPassword=android
keyAlias=androiddebugkey
storeFile=debug.keystore
EOF
          else
            echo "No keystore found - APK will be debug-signed with runner default key."
          fi

      - name: Build release APK
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release --dart-define=JAMENDO_CLIENT_ID=$JAMENDO_CLIENT_ID --dart-define=GEMINI_API_KEY=$GEMINI_API_KEY

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk app-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: jumbo-music-release-apk
          path: app-release.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Publish GitHub Release (this makes the in-app APK link work)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: apk-v2.0.0-${{ github.run_number }}
          name: Jumbo Music APK v2.0.0 (Build ${{ github.run_number }})
          make_latest: true
          files: app-release.apk
