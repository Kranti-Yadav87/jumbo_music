name: CI (analyze, test, web build)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Static analysis (warnings and errors fail the build)
        run: flutter analyze --no-fatal-infos
      - name: Unit and widget tests
        run: flutter test --coverage
      - name: Verify web release build
        run: flutter build web --release --base-href /
