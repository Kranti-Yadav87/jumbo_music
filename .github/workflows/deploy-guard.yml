name: Deployment Guard & Web Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-build:
    name: Verify Flutter Web Release Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Verify Web Compilation
        run: flutter build web --release --base-href / --no-wasm-dry-run
