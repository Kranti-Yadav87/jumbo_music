<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Jumbo Music - Stream millions of live Bollywood, Punjabi, and International songs in high-fidelity 320kbps audio.">
  <meta name="theme-color" content="#000000">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jumbo Music">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jumbo Music - Live Music Streaming</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #09090f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    .loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #17162e 0%, #09090f 70%);
      z-index: 999999;
    }
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .brand-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }
    .brand-icon svg {
      width: 36px;
      height: 36px;
      fill: #ffffff;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, #a5b4fc);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-subtitle {
      font-size: 13px;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }
    .spinner-ring {
      margin-top: 24px;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-screen">
    <div class="logo-container">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <div class="brand-title">Jumbo Music</div>
      <div class="brand-subtitle">Starting live stream engine...</div>
      <div class="spinner-ring"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.transition = 'opacity 0.4s ease';
        setTimeout(function() { loader.remove(); }, 400);
      }
    });

    window.downloadAudioFile = function(url, filename) {
      try {
        var a = document.createElement('a');
        a.href = url;
        a.download = filename || 'jumbo_music_track.mp3';
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (e) {
        console.error('Download error:', e);
      }
    };

    window.jumboStorageGet = function(key) {
      try {
        return window.localStorage.getItem(key);
      } catch(e) {
        return null;
      }
    };

    window.jumboStorageSet = function(key, val) {
      try {
        window.localStorage.setItem(key, val);
      } catch(e) {}
    };

    window.jumboStorageRemove = function(key) {
      try {
        window.localStorage.removeItem(key);
      } catch(e) {}
    };
    // PWA Install Prompt Capture & Triggers
    window.deferredPwaPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.deferredPwaPrompt = e;
      console.log('Jumbo Music PWA install prompt captured and ready.');
    });

    window.triggerPwaInstall = async function () {
      if (window.deferredPwaPrompt) {
        window.deferredPwaPrompt.prompt();
        var choice = await window.deferredPwaPrompt.userChoice;
        window.deferredPwaPrompt = null;
        return choice.outcome === 'accepted';
      }
      return false;
    };

    window.canInstallPwa = function () {
      return !!window.deferredPwaPrompt;
    };

    // === MediaSession & Lock Screen Engine ===
    window.jumboMediaActionHandler = null;

    window.jumboMediaUpdateMetadata = function(title, artist, album, coverUrl) {
      if (!('mediaSession' in navigator)) return;
      try {
        var artworkList = [];
        var srcUrl = (coverUrl && coverUrl.trim().length > 0) ? coverUrl.trim() : 'icons/Icon-512.png';
        var sizes = [96, 128, 192, 256, 384, 512];
        for (var i = 0; i < sizes.length; i++) {
          artworkList.push({
            src: srcUrl,
            sizes: sizes[i] + 'x' + sizes[i]
          });
        }
        navigator.mediaSession.metadata = new MediaMetadata({
          title: title || 'Jumbo Music',
          artist: artist || 'Unknown Artist',
          album: album || 'Jumbo Music',
          artwork: artworkList
        });
      } catch (e) {
        console.warn('Error setting MediaMetadata:', e);
      }
    };

    window.jumboMediaUpdatePlaybackState = function(isPlaying) {
      if (!('mediaSession' in navigator)) return;
      try {
        navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
      } catch (e) {}
    };

    window.jumboMediaUpdatePositionState = function(durationSec, positionSec, speed) {
      if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
      try {
        if (durationSec && durationSec > 0) {
          var curPos = positionSec || 0;
          if (curPos > durationSec) curPos = durationSec;
          if (curPos < 0) curPos = 0;
          navigator.mediaSession.setPositionState({
            duration: durationSec,
            playbackRate: speed || 1.0,
            position: curPos
          });
        }
      } catch (e) {}
    };

    window.jumboRegisterMediaActionHandler = function(handler) {
      window.jumboMediaActionHandler = handler;
      if (!('mediaSession' in navigator)) return;

      var actions = [
        ['play', function() { window.jumboDispatchMediaAction('play', 0); }],
        ['pause', function() { window.jumboDispatchMediaAction('pause', 0); }],
        ['previoustrack', function() { window.jumboDispatchMediaAction('previous', 0); }],
        ['nexttrack', function() { window.jumboDispatchMediaAction('next', 0); }],
        ['seekto', function(details) { window.jumboDispatchMediaAction('seek', details ? details.seekTime : 0); }],
        ['seekbackward', function(details) { window.jumboDispatchMediaAction('seekbackward', details ? (details.seekOffset || 10) : 10); }],
        ['seekforward', function(details) { window.jumboDispatchMediaAction('seekforward', details ? (details.seekOffset || 10) : 10); }]
      ];

      for (var i = 0; i < actions.length; i++) {
        try {
          navigator.mediaSession.setActionHandler(actions[i][0], actions[i][1]);
        } catch (e) {}
      }
    };

    window.jumboDispatchMediaAction = function(action, param) {
      if (typeof window.jumboMediaActionHandler === 'function') {
        try {
          window.jumboMediaActionHandler(action, param || 0);
        } catch (e) {
          console.error('Error in jumboDispatchMediaAction:', e);
        }
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
